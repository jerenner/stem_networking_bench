%YAML 1.2
---
# Local unconstrained processing-capacity run on one 16-GiB RTX 5060 Ti.
source: "synthetic"
num_receivers: 2

synthetic:
  mode: "packet"
  gpu_device: 0
  rate_mode: "maximum"
  duration_seconds: 300.0
  buckets_per_receiver: 0
  packets_per_burst: 16384
  payload_pattern: "walking_dot"
  validate_output: false
  report_interval_seconds: 1.0

stem_rx:
  frames_per_tensor: 128
  expected_source_mask: 255
  header_size: 42
  payload_size: 8192
  gpu_header_extract: true
  tile_duplicate_prefix_to_simulate_payload: false
  batch_close_slack_packets: 512

processor:
  # Preserve individual corrected frames; all enabled corrections still run.
  noop: true
  subtract_dark_frame: true
  dark_frame_path: "/calibration/dark.h5"
  dark_frame_dataset: "/processed"
  apply_valid_pixel_mask: true
  valid_pixel_mask_dataset: "/valid_pixel_mask"
  apply_blr_correction: true
  blr_rows: 30
  blr_zlp_width: 768
  blr_zlp_group_columns: 4
  blr_core_group_columns: 16
  apply_dynamic_half_column_mask: true
  dynamic_mask_median_window_pixels: 31
  dynamic_mask_threshold_ratio: 1.0
  dynamic_mask_threshold_offset: 500.0
  dynamic_mask_excluded_edge_rows: 32
  dynamic_mask_two_sided: true

writer:
  noop: true
burst_writer:
  enabled: false
thinned_stream:
  enabled: false
control:
  enabled: false
