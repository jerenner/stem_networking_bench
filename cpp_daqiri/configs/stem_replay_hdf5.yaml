%YAML 1.2
---
source: "hdf5"

replayer:
  filepath: "/tmp/stem_input.h5"
  dataset_name: "/frames"
  # DAQIRI replay is finite; repeat:true is rejected.
  repeat: false
  start_frame: 0
  frames_per_tensor: 128
  count: 128

processor:
  noop: true
  subtract_dark_frame: false
  dark_frame_path: ""
  dark_frame_dataset: "/processed"
  apply_valid_pixel_mask: false
  valid_pixel_mask_dataset: "/valid_pixel_mask"
  apply_blr_correction: false
  blr_rows: 30
  blr_zlp_width: 768
  blr_zlp_group_columns: 4
  blr_core_group_columns: 16
  apply_dynamic_half_column_mask: false
  dynamic_mask_median_window_pixels: 31
  dynamic_mask_threshold_ratio: 1.0
  dynamic_mask_threshold_offset: 500.0
  dynamic_mask_excluded_edge_rows: 32
  dynamic_mask_two_sided: true

writer:
  filepath: "/tmp/stem_replay_out.h5"
  dataset_name: "/processed"
  noop: false
  num_concurrent: 3

# Optional offline tests of the same auxiliary outputs used by the network RX.
# Burst mode and the continuous writer are mutually exclusive.
burst_writer:
  enabled: false
  start_armed: true
  processing_stage: "corrected"
  filepath_template: "/tmp/stem_replay_burst_rx{receiver}_{capture}.h5"
  dataset_name: "/frames"
  buckets_per_capture: 1
  capture_count: 1
  rearm_after_write: true
  strict_complete: true
  threshold:
    zlp: 0.0
    core_loss: 0.0

thinned_stream:
  enabled: false
  start_publishing: true
  endpoint: "tcp://*:5556"
  topic_prefix: "stem"
  total_refresh_hz: 10.0
  processing_stage: "corrected"
  representative_frame_index: 64
  include_representative_frame: true
  include_bucket_sum: true
  queue_depth: 2
  threshold:
    zlp: 0.0
    core_loss: 0.0
